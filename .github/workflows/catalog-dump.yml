name: Catalog dump
run-name: Catalog dump (${{ inputs.category || 'all' }})

on:
  schedule:
    # Midnight EST (05:00 UTC); runs at 01:00 EDT while DST is in effect
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: Which category to dump
        type: choice
        default: all
        options:
          - all
          - magic
          - lorcana
          - riftbound
          - onepiece
          - yugioh
          - fleshandblood

permissions:
  contents: read

jobs:
  # Scheduled runs dump everything, manual runs honor the selection. The
  # matrix context is not available in a job level if, so the selection is
  # applied by building the matrix itself.
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED: ${{ inputs.category || 'all' }}
        run: |
          categories='[
            {"name": "magic", "category": 1},
            {"name": "lorcana", "category": 71},
            {"name": "riftbound", "category": 89},
            {"name": "onepiece", "category": 68},
            {"name": "yugioh", "category": 2},
            {"name": "fleshandblood", "category": 62}
          ]'
          if [ "$SELECTED" = all ]; then
            selection=$(jq -c . <<< "$categories")
          else
            selection=$(jq -c --arg name "$SELECTED" \
              '[.[] | select(.name == $name)]' <<< "$categories")
          fi
          echo "Dumping: $selection"
          echo "matrix=$selection" >> "$GITHUB_OUTPUT"

  dump:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One category at a time to keep the API request rate down
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build tcgdumper
        run: go build ./cmd/tcgdumper

      - name: Dump ${{ matrix.name }} catalog
        env:
          TCGPLAYER_PUBLIC_KEY: ${{ secrets.TCGPLAYER_PUBLIC_KEY }}
          TCGPLAYER_PRIVATE_KEY: ${{ secrets.TCGPLAYER_PRIVATE_KEY }}
        run: ./tcgdumper -category ${{ matrix.category }} > tcgplayer-catalog.json

      - name: Compress
        run: xz -T0 tcgplayer-catalog.json

      # The B2 upload overwrites the same object daily, so the run keeps
      # the only per-run history: the exact dump a datastore build consumed,
      # downloadable without bucket credentials, surviving a failed upload.
      - name: Keep a copy on the run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-tcgplayer-catalog.json.xz
          path: tcgplayer-catalog.json.xz
          retention-days: 7

      - name: Upload to B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          pipx install b2
          b2 file upload mtgban-datastore tcgplayer-catalog.json.xz ${{ matrix.name }}/tcgplayer-catalog.json.xz
